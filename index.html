<style>
:root{--bg:#161236;--bg2:#241b66;--ink:#1b1740;--sun:#ffd640;--soft:#d9d3ff;--font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);color:#fff;background:radial-gradient(120% 60% at 50% 0%,var(--bg2) 0%,var(--bg) 62%) fixed,var(--bg);padding:0 16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(pattern.svg) 0 0/240px 240px;opacity:.07;pointer-events:none}
.wrap{max-width:460px;margin:0 auto;padding:28px 0 40px}
header{display:flex;align-items:flex-end;gap:6px;justify-content:center}
header img{width:150px;height:auto;display:block;flex:none}
.bubble{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:50%/46%;padding:16px 20px;margin-bottom:40px;max-width:230px;text-align:center}
.bubble b{display:block;font-size:19px;line-height:1.15;font-weight:800}
.bubble span{display:block;margin-top:4px;font-size:13px;font-weight:600;color:#5a4bd6}
h1{margin:14px 0 4px;text-align:center;font-size:28px;font-weight:800}
.sub{margin:0 auto 22px;text-align:center;color:var(--soft);font-size:14px}
.go{display:block;text-decoration:none;background:#fff;color:var(--ink);border-radius:18px;padding:16px 18px;margin-top:12px}
.go b{display:block;font-size:19px;font-weight:800}
.go small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:#5b5780}
.go:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{margin-top:26px;text-align:center;font-size:12px;color:var(--soft);line-height:1.6}
footer a{color:var(--sun);font-weight:700}
</style>
</head>
<body>
